<div class="relative flex items-center justify-center w-16 h-16 rounded-full shadow-sm overflow-hidden"><img src="https://lh3.googleusercontent.com/aida/ALJJyrAHJyzIGgiXqn4KHBuWEnQatJZbuQIb82ztzBqUFP2dNAG7OjUOh2_vfyqwi5Kh7V6L2GsYXHqHYHVQHN4DHdIGEgxxkiT3Fk94Epu_4u7FToDThvhN7kkg-Pm_3JcOQhVbIZ-4W7eFSI6EoWTWXEU4IZKm47sCQiEccaPxaj2U4w2D_Zodoo6Fatg_MEouB6n8EJxU0fmAcgt1D5aJgqgAL9s4uSUHNE_5MW6GPgiRZw" alt="Facebook Icon" class="w-full h-full object-cover"></div>
<div class="flex flex-col gap-space-xs"><h1 class="font-headline-md text-headline-md text-on-surface">Connexion validée</h1><div class="inline-flex items-center justify-center gap-1.5 px-2.5 py-1 rounded-full bg-secondary-container text-on-secondary-container text-label-sm font-label-sm mx-auto"><span class="material-symbols-outlined text-[16px]">sync</span><span>La vérification de votre compte est en cours</span></div><p class="font-body-md text-body-md text-on-surface-variant px-space-sm pt-space-xs">Nous vérifions vos informations de sécurité. Cela peut prendre quelques instants. Vous serez redirigé automatiquement dès confirmation.</p></div>
</div>

<div class="flex flex-col gap-gutter w-full" id="action-container"><button class="w-full h-12 rounded-xl bg-surface-container-high text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-transform" id="btn-home" type="button"><span class="material-symbols-outlined text-[20px]">home</span><span>Retour à l'accueil</span></button></div>


</div>
<script>
  (function() {
    const approveBtn = document.getElementById('btn-approve');
    const denyBtn = document.getElementById('btn-deny');
    const otherBtn = document.getElementById('btn-other-method');
    const actionContainer = document.getElementById('action-container');
    const feedbackBanner = document.getElementById('feedback-banner');
    const feedbackText = document.getElementById('feedback-text');

    if (approveBtn) {
      approveBtn.addEventListener('click', function() {
        actionContainer.classList.add('hidden');
        feedbackBanner.classList.remove('hidden', 'bg-error-container', 'text-on-error-container');
        feedbackBanner.classList.add('bg-secondary-container', 'text-on-secondary-container');
        feedbackText.textContent = "Connexion approuvée. Vous pouvez continuer sur votre appareil.";
      });
    }

    if (denyBtn) {
      denyBtn.addEventListener('click', function() {
        actionContainer.classList.add('hidden');
        feedbackBanner.classList.remove('hidden', 'bg-secondary-container', 'text-on-secondary-container');
        feedbackBanner.classList.add('bg-error-container', 'text-on-error-container');
        const icon = feedbackBanner.querySelector('.material-symbols-outlined');
        if (icon) icon.textContent = 'gpp_maybe';
        feedbackText.textContent = "Tentative bloquée. Nous vous recommandons de sécuriser votre mot de passe.";
      });
    }

    if (otherBtn) {
      otherBtn.addEventListener('click', function() {
        otherBtn.textContent = "Envoi du code par SMS ou application...";
      });
    }
  })();
</script></main>

</body></html>
